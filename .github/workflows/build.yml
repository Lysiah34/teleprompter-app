name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Générer la structure Android native
        run: |
          # 1. On sauvegarde temporairement tes fichiers personnalisés
          cp lib/main.dart main_backup.dart
          cp pubspec.yaml pubspec_backup.yaml
          cp android/app/src/main/AndroidManifest.xml manifest_backup.xml
          
          # 2. On demande à Flutter de créer tous les fichiers Android manquants
          flutter create --platforms android .
          
          # 3. On remet tes fichiers par-dessus la structure toute neuve
          mv main_backup.dart lib/main.dart
          mv pubspec_backup.yaml pubspec.yaml
          mv manifest_backup.xml android/app/src/main/AndroidManifest.xml
          
      - name: Installer les dépendances
        run: flutter pub get
        
      - name: Construire l'APK
        run: flutter build apk --release
        
      - name: Mettre à disposition l'application
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
